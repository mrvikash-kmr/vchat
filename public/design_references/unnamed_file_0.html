<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>vChat Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#F97316", // Vibrant orange accent
                        "background-light": "#FDFCFB",
                        "background-dark": "#0A0A0A",
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1.5rem",
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .vchat-gradient {
            background: radial-gradient(circle at top right, #3d2b24 0%, #1a1a1a 45%, #0a0a0a 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-glow {
            filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.4));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen p-4">
<div class="relative w-full max-w-[390px] h-[844px] bg-background-dark rounded-[55px] border-[8px] border-neutral-800 shadow-2xl overflow-hidden">
<div class="absolute top-0 left-0 right-0 h-11 flex justify-between items-center px-8 z-50">
<div class="text-white text-[15px] font-semibold">9:41</div>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-rounded text-[18px] text-white">signal_cellular_alt</span>
<span class="material-symbols-rounded text-[18px] text-white">wifi</span>
<span class="material-symbols-rounded text-[20px] text-white rotate-90">battery_full</span>
</div>
</div>
<div class="absolute top-2 left-1/2 -translate-x-1/2 w-[120px] h-[35px] bg-black rounded-[20px] z-50"></div>
<div class="w-full h-full relative vchat-gradient flex flex-col items-center justify-center overflow-hidden">
<div class="absolute top-[-10%] right-[-20%] w-[300px] h-[300px] bg-orange-900/10 blur-[100px] rounded-full animate-pulse-slow"></div>
<div class="absolute bottom-[-5%] left-[-10%] w-[250px] h-[250px] bg-neutral-800/30 blur-[80px] rounded-full"></div>
<div class="flex flex-col items-center space-y-6 z-10">
<div class="relative w-24 h-24 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-neutral-600/20 to-neutral-900/40 rounded-[32px] rounded-bl-lg border border-white/10 glass-panel logo-glow"></div>
<span class="text-6xl font-black text-white italic relative -mt-1 select-none">
                        v<span class="text-primary drop-shadow-[0_0_8px_rgba(249,115,22,0.8)]">.</span>
</span>
</div>
<div class="text-center space-y-1">
<h1 class="text-4xl font-extrabold tracking-tight text-white">vChat</h1>
<p class="text-neutral-400 text-sm font-medium tracking-widest uppercase opacity-80">Premium Messaging</p>
</div>
</div>
<div class="absolute bottom-20 w-full px-12 space-y-4">
<div class="flex justify-center items-center gap-2">
<span class="text-neutral-500 text-xs font-semibold tracking-wider uppercase">Connecting</span>
<span class="flex gap-1">
<span class="w-1 h-1 bg-primary rounded-full animate-bounce [animation-delay:-0.3s]"></span>
<span class="w-1 h-1 bg-primary rounded-full animate-bounce [animation-delay:-0.15s]"></span>
<span class="w-1 h-1 bg-primary rounded-full animate-bounce"></span>
</span>
</div>
<div class="relative h-[4px] w-full bg-neutral-800/50 rounded-full overflow-hidden">
<div class="absolute inset-y-0 left-0 w-1/3 bg-gradient-to-r from-primary/50 to-primary rounded-full animate-shimmer"></div>
<div class="absolute top-0 left-1/3 w-8 h-full bg-white/20 blur-sm"></div>
</div>
</div>
<div class="absolute bottom-12 flex flex-col items-center space-y-2">
<div class="flex items-center space-x-1.5 opacity-50">
<span class="material-symbols-rounded text-white text-xs">lock</span>
<span class="text-[10px] text-white font-medium uppercase tracking-widest">End-to-End Encrypted</span>
</div>
</div>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[134px] h-[5px] bg-white/30 rounded-full"></div>
</div>
</div>

</body></html>
