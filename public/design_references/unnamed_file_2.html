<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>vChat Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#E27B58", // Warm sunset tone from the reference
              "background-light": "#F5F5F7",
              "background-dark": "#0F0D0C", // Deep dark base from reference
              "card-dark": "rgba(28, 26, 25, 0.7)",
              "glass": "rgba(255, 255, 255, 0.05)"
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1.5rem",
              "xl": "2rem",
            },
          },
        },
      };
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-morphism {
            background: rgba(40, 38, 36, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-bg {
            background: radial-gradient(circle at top right, rgba(226, 123, 88, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(63, 56, 54, 0.4), transparent);
        }
        .status-bar {
            height: 44px;
        }
        .ios-notch {
            width: 120px;
            height: 30px;
            background: #000;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            margin: 0 auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-[393px] h-[852px] bg-background-light dark:bg-background-dark rounded-[55px] overflow-hidden border-[8px] border-slate-900 dark:border-[#1F1D1C] shadow-2xl">
<div class="absolute inset-0 gradient-bg pointer-events-none"></div>
<div class="status-bar flex justify-between items-center px-8 pt-4 relative z-10">
<span class="text-sm font-semibold">9:41</span>
<div class="ios-notch absolute top-0 left-1/2 -translate-x-1/2"></div>
<div class="flex items-center space-x-1.5">
<span class="material-icons-outlined text-[18px]">signal_cellular_alt</span>
<span class="material-icons-outlined text-[18px]">wifi</span>
<span class="material-icons-outlined text-[20px] rotate-90">battery_full</span>
</div>
</div>
<div class="px-6 pt-6 pb-2 relative z-10">
<div class="flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-morphism">
<span class="material-icons-outlined text-xl">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-semibold">Profile Setup</h1>
<div class="w-10"></div>
</div>
</div>
<div class="px-8 pt-10 flex flex-col items-center relative z-10">
<div class="relative group">
<div class="w-36 h-36 rounded-full glass-morphism flex items-center justify-center border-2 border-dashed border-white/20 hover:border-primary transition-colors cursor-pointer overflow-hidden">
<div class="text-center">
<span class="material-icons-outlined text-4xl text-white/50 group-hover:text-primary transition-colors">add_a_photo</span>
<p class="text-[10px] uppercase tracking-wider font-semibold text-white/40 mt-1">Upload</p>
</div>
</div>
<div class="absolute bottom-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center border-4 border-background-dark">
<span class="material-icons-outlined text-white text-sm">edit</span>
</div>
</div>
<div class="mt-4 text-center">
<h2 class="text-xl font-bold">Personalize your profile</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Add a photo and details to let others know it's you.</p>
</div>
<div class="w-full mt-10 space-y-6">
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-widest text-white/40 ml-1">Full Name</label>
<div class="relative">
<input class="w-full h-14 glass-morphism border-none rounded-2xl px-5 text-base focus:ring-2 focus:ring-primary placeholder:text-white/20" placeholder="e.g. Khadija Dubois" type="text"/>
<span class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/20">person</span>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-widest text-white/40 ml-1">Bio</label>
<div class="relative">
<textarea class="w-full glass-morphism border-none rounded-2xl px-5 py-4 text-base focus:ring-2 focus:ring-primary placeholder:text-white/20 resize-none" placeholder="Write something interesting..." rows="3"></textarea>
</div>
</div>
<div class="flex flex-wrap gap-2 mt-4">
<span class="px-3 py-1.5 glass-morphism rounded-full text-xs font-medium text-white/60">#Traveler</span>
<span class="px-3 py-1.5 glass-morphism rounded-full text-xs font-medium text-white/60">#Tech</span>
<span class="px-3 py-1.5 glass-morphism rounded-full text-xs font-medium text-white/60">#Creative</span>
</div>
</div>
</div>
<div class="absolute bottom-0 left-0 w-full px-8 pb-12 pt-6 bg-gradient-to-t from-background-dark to-transparent z-20">
<button class="w-full bg-primary hover:bg-opacity-90 active:scale-[0.98] transition-all h-14 rounded-2xl font-bold text-white shadow-lg shadow-primary/20 flex items-center justify-center space-x-2">
<span>Complete Profile</span>
<span class="material-icons-outlined">arrow_forward</span>
</button>
<p class="text-center text-[11px] text-white/30 mt-4 px-4">
                By completing, you agree to our Terms of Service and Privacy Policy.
            </p>
</div>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/20 rounded-full"></div>
</div>

</body></html>
